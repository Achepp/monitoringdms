<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring DMS</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class', 
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      transition: background-color 0.3s ease;
    }
    body.dark {
      background-color: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }

    /* CSS Variables Khusus untuk Recharts agar ganti tema tidak memicu Render Ulang di JS */
    :root {
      --chart-axis: #64748b;
      --chart-grid: #e2e8f0;
      --chart-tooltip-bg: #ffffff;
      --chart-tooltip-border: #e2e8f0;
      --chart-tooltip-text: #0f172a;
      --chart-cursor: #f8fafc;
    }
    html.dark, .dark {
      --chart-axis: #94a3b8;
      --chart-grid: #334155;
      --chart-tooltip-bg: #1e293b;
      --chart-tooltip-border: #334155;
      --chart-tooltip-text: #f8fafc;
      --chart-cursor: #334155;
    }
  </style>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script>window.react = window.React;</script>

  <!-- Babel untuk kompilasi JSX langsung di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts Dependencies -->
  <script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
  <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide-react@0.292.0/dist/umd/lucide-react.js"></script>

  <!-- Mencegah ResizeObserver warning tanpa memicu infinite loop atau freeze -->
  <script>
    window.addEventListener('error', function(e) {
      if (e.message && /resizeobserver/i.test(e.message)) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    });
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const { 
      BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, Legend, ResponsiveContainer,
      PieChart, Pie, Cell, LineChart, Line
    } = window.Recharts;
    
    const Lucide = window.lucideReact || window.lucide || window.LucideReact;
    const { 
      LayoutDashboard, ClipboardList, Database, LogOut, Search, Filter, 
      Download, CheckCircle, AlertCircle, Loader2, Menu, X,
      Activity, Clock, Package, AlertTriangle, ChevronLeft, ChevronRight, Inbox,
      Sun, Moon, BarChart2, RefreshCw, ChevronDown, Calendar, FileText, Settings
    } = Lucide;

    const GAS_URL = "https://script.google.com/macros/s/AKfycbzfqf9QKzH-OUMX5RIJ-Nzy54DXmO9lNowKXXxxRDgf1XSbk8jGCvAyPddOGwC-t1ks/exec"; 

    const GROUP_PROSES = ["Aerosol", "Epoxy", "Melamine", "Politur", "Thinner", "Waterbased", "Wood filler", "Utility"];
    const SHIFTS = ["Pagi", "Siang"];
    const MONTHS = [
      { value: '01', label: 'Januari' },
      { value: '02', label: 'Februari' },
      { value: '03', label: 'Maret' },
      { value: '04', label: 'April' },
      { value: '05', label: 'Mei' },
      { value: '06', label: 'Juni' },
      { value: '07', label: 'Juli' },
      { value: '08', label: 'Agustus' },
      { value: '09', label: 'September' },
      { value: '10', label: 'Oktober' },
      { value: '11', label: 'November' },
      { value: '12', label: 'Desember' }
    ];
    const STATUS_FIELDS = [
      { id: 'proses_produksi', label: 'Proses Produksi' },
      { id: 'pending_produksi', label: 'Pending Produksi' },
      { id: 'proses_kemas', label: 'Proses Kemas' },
      { id: 'pending_kemas', label: 'Pending Kemas' },
      { id: 'selesai_kemas', label: 'Selesai Kemas' },
      { id: 'tk', label: 'TK' },
      { id: 'wash', label: 'Wash' },
      { id: 'dirty', label: 'Dirty' }
    ];
    const COLORS = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4', '#64748b', '#ec4899'];

    // Status Categories & Colors khusus Chart Status Produksi per Group
    const STATUS_PRODUKSI_CATEGORIES = [
      { id: 'proses_produksi', label: 'Proses Produksi', color: '#3b82f6' },
      { id: 'pending_produksi', label: 'Pending Produksi', color: '#ef4444' },
      { id: 'proses_kemas', label: 'Proses Kemas', color: '#10b981' },
      { id: 'pending_kemas', label: 'Pending Kemas', color: '#f59e0b' },
      { id: 'selesai_kemas', label: 'Selesai Kemas', color: '#8b5cf6' },
      { id: 'dirty', label: 'Dirty', color: '#ec4899' },
      { id: 'tk', label: 'TK', color: '#06b6d4' },
      { id: 'wash', label: 'Wash', color: '#64748b' }
    ];

    const TARGET_PRODUCTION_GROUPS = ["Epoxy", "Politur", "Waterbased", "Utility"];

    const ThreeDotsIcon = ({ size = 18, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="1.2" fill="currentColor" />
        <circle cx="12" cy="5" r="1.2" fill="currentColor" />
        <circle cx="12" cy="19" r="1.2" fill="currentColor" />
      </svg>
    );

    const formatIndoDate = (dateVal, isShort = false) => {
      if (!dateVal) return '';
      if (typeof dateVal === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateVal.trim())) {
        const [y, m, d] = dateVal.trim().split('-');
        const dateObj = new Date(Number(y), Number(m) - 1, Number(d));
        return dateObj.toLocaleDateString('id-ID', { 
          day: 'numeric', 
          month: isShort ? 'short' : 'long', 
          year: 'numeric' 
        });
      }
      const d = new Date(dateVal);
      if (isNaN(d.getTime())) return dateVal;
      return d.toLocaleDateString('id-ID', { 
        day: 'numeric', 
        month: isShort ? 'short' : 'long', 
        year: 'numeric' 
      });
    };

    const generateMockData = () => {
      const data = [];
      const today = new Date();
      for(let i=0; i<50; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - Math.floor(Math.random() * 30));
        const pProd = Math.floor(Math.random() * 50);
        data.push({
          id: i,
          timestamp: d.toISOString(),
          tanggal: d.toISOString().split('T')[0],
          group_proses: GROUP_PROSES[Math.floor(Math.random() * GROUP_PROSES.length)],
          shift: SHIFTS[Math.floor(Math.random() * SHIFTS.length)],
          proses_produksi: Math.floor(Math.random() * 100),
          pending_produksi: pProd,
          pending_proses: pProd,
          proses_kemas: Math.floor(Math.random() * 80),
          pending_kemas: Math.floor(Math.random() * 30),
          selesai_kemas: Math.floor(Math.random() * 90),
          tk: Math.floor(Math.random() * 20),
          wash: Math.floor(Math.random() * 10),
          dirty: Math.floor(Math.random() * 5)
        });
      }
      return data;
    };

    let MOCK_DB = generateMockData();

    const apiService = {
      fetchData: async () => {
        let rawData = [];
        if (GAS_URL) {
          const res = await fetch(`${GAS_URL}?action=getData`);
          const json = await res.json();
          if (json.status === 'success') {
            rawData = json.data || [];
          }
        } else {
          rawData = MOCK_DB;
        }

        const normalizedData = rawData.map(row => {
          let normalizedTanggal = row.tanggal;
          if (row.tanggal) {
            if (typeof row.tanggal === 'string' && row.tanggal.includes('T')) {
              const d = new Date(row.tanggal);
              if (!isNaN(d.getTime())) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                normalizedTanggal = `${y}-${m}-${day}`;
              }
            } else if (row.tanggal instanceof Date && !isNaN(row.tanggal.getTime())) {
              const y = row.tanggal.getFullYear();
              const m = String(row.tanggal.getMonth() + 1).padStart(2, '0');
              const day = String(row.tanggal.getDate()).padStart(2, '0');
              normalizedTanggal = `${y}-${m}-${day}`;
            }
          }

          const pendingProdVal = row.pending_produksi !== undefined 
            ? Number(row.pending_produksi || 0) 
            : Number(row.pending_proses || 0);
          
          const tkVal = row.tk !== undefined ? Number(row.tk || 0) : Number(row.tk_ || 0);
          const washVal = row.wash !== undefined ? Number(row.wash || 0) : Number(row.wash_ || 0);

          return {
            ...row,
            tanggal: normalizedTanggal,
            pending_produksi: pendingProdVal,
            pending_proses: pendingProdVal,
            tk: tkVal,
            tk_: tkVal,
            wash: washVal,
            wash_: washVal
          };
        });

        return { status: 'success', data: normalizedData };
      },
      saveData: async (payload) => {
        const pProd = payload.pending_produksi !== undefined ? payload.pending_produksi : (payload.pending_proses || 0);
        const normalizedPayload = {
          ...payload,
          pending_produksi: pProd,
          pending_proses: pProd
        };
        if (GAS_URL) {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'addData', data: normalizedPayload })
          });
          return res.json();
        }
        return new Promise(resolve => setTimeout(() => {
          MOCK_DB.unshift({ ...normalizedPayload, timestamp: new Date().toISOString(), id: Date.now() });
          resolve({ status: 'success' });
        }, 1000));
      }
    };

    const KaruForm = React.memo(({ onSuccess }) => {
      const [formData, setFormData] = useState({
        tanggal: new Date().toISOString().split('T')[0],
        group_proses: '',
        shift: '',
        proses_produksi: 0, pending_produksi: 0, pending_proses: 0, proses_kemas: 0, pending_kemas: 0,
        selesai_kemas: 0, tk: 0, wash: 0, dirty: 0
      });
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);

      const handleChange = (e) => {
        const { name, value, type } = e.target;
        let val = value;
        if (type === 'number') {
          val = parseInt(value) || 0;
          if (val < 0) val = 0; 
        }
        setFormData(prev => ({ ...prev, [name]: val }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          await apiService.saveData(formData);
          setToast({ type: 'success', message: 'Data berhasil disimpan ke sistem!' });
          onSuccess();
          const resetNumbers = {};
          STATUS_FIELDS.forEach(f => resetNumbers[f.id] = 0);
          setFormData(prev => ({ ...prev, ...resetNumbers }));
          setTimeout(() => setToast(null), 3000);
        } catch (error) {
          setToast({ type: 'error', message: 'Gagal menyimpan data.' });
        }
        setLoading(false);
      };

      return (
        <div className="max-w-4xl mx-auto bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden transition-colors">
          <div className="bg-blue-600 dark:bg-blue-700 p-6 text-white transition-colors">
            <h2 className="text-2xl font-bold">Input Data Produksi</h2>
            <p className="text-blue-100 text-sm mt-1">Formulir laporan harian status proses produksi dan kemas.</p>
          </div>

          {toast && (
            <div className={`p-4 m-6 rounded-lg flex items-center gap-3 ${toast.type === 'success' ? 'bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-400' : 'bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-400'}`}>
              {toast.type === 'success' ? <CheckCircle size={20} /> : <AlertCircle size={20} />}
              <span>{toast.message}</span>
            </div>
          )}

          <form onSubmit={handleSubmit} className="p-6 space-y-8">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div>
                <label className="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Tanggal</label>
                <input type="date" name="tanggal" required value={formData.tanggal} onChange={handleChange} 
                       className="w-full px-4 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" />
              </div>
              <div>
                <label className="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Group Proses</label>
                <select name="group_proses" required value={formData.group_proses} onChange={handleChange}
                        className="w-full px-4 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                  <option value="" disabled>Pilih Group...</option>
                  {GROUP_PROSES.map(g => <option key={g} value={g}>{g}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Shift</label>
                <select name="shift" required value={formData.shift} onChange={handleChange}
                        className="w-full px-4 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                  <option value="" disabled>Pilih Shift...</option>
                  {SHIFTS.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            </div>

            <hr className="border-slate-100 dark:border-slate-700 transition-colors" />

            <div>
              <h3 className="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-4">Detail Status Proses (Qty)</h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                {STATUS_FIELDS.map(field => (
                  <div key={field.id} className="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-100 dark:border-slate-600/50 transition-colors">
                    <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">{field.label}</label>
                    <input type="number" name={field.id} min="0" required value={formData[field.id]} onChange={handleChange}
                           className="w-full px-4 py-2 text-lg font-semibold bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
                  </div>
                ))}
              </div>
            </div>

            <div className="flex justify-end pt-4">
              <button type="submit" disabled={loading}
                      className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-semibold shadow-sm transition-colors flex items-center gap-2">
                {loading ? <Loader2 className="animate-spin" size={20} /> : <CheckCircle size={20} />}
                {loading ? 'Menyimpan...' : 'Submit Data'}
              </button>
            </div>
          </form>
        </div>
      );
    });

    // ==========================================
    // 🧩 KOMPONEN: Status Produksi per Group (Horizontal Stacked Bar Chart)
    // ==========================================
    const StatusProduksiPerGroupChart = React.memo(({ 
      data = [], 
      isDarkMode = false, 
      selectedGroup = '', 
      selectedStatus = '', 
      onFilterChange, 
      onResetFilter,
      title = "Status Produksi per Group",
      subtitle = "Distribusi status order pada setiap group proses"
    }) => {
      const [viewMode, setViewMode] = useState('total'); // 'total' (Total Order) or 'percentage' (Percentage)
      const [showModeDropdown, setShowModeDropdown] = useState(false);
      const [showMenuDropdown, setShowMenuDropdown] = useState(false);
      const [showGridlines, setShowGridlines] = useState(true);
      const [hoveredSegment, setHoveredSegment] = useState(null);
      const [copiedNotification, setCopiedNotification] = useState(false);

      const modeDropdownRef = React.useRef(null);
      const menuDropdownRef = React.useRef(null);

      // Close dropdowns on outside click
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (modeDropdownRef.current && !modeDropdownRef.current.contains(e.target)) {
            setShowModeDropdown(false);
          }
          if (menuDropdownRef.current && !menuDropdownRef.current.contains(e.target)) {
            setShowMenuDropdown(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      // Calculate aggregated data for ALL group proses
      const groupsData = useMemo(() => {
        // Collect all available groups from GROUP_PROSES and data
        const allGroupsSet = new Set(GROUP_PROSES);
        data.forEach(row => {
          if (row.group_proses && String(row.group_proses).trim()) {
            allGroupsSet.add(String(row.group_proses).trim());
          }
        });
        const allGroups = Array.from(allGroupsSet);

        return allGroups.map(groupName => {
          const counts = {};
          STATUS_PRODUKSI_CATEGORIES.forEach(cat => {
            counts[cat.id] = 0;
          });

          data.forEach(row => {
            if (row.group_proses === groupName) {
              STATUS_PRODUKSI_CATEGORIES.forEach(cat => {
                counts[cat.id] += Number(row[cat.id] || 0);
              });
            }
          });

          const totalOrder = STATUS_PRODUKSI_CATEGORIES.reduce((acc, cat) => acc + (counts[cat.id] || 0), 0);

          // Find first and last visible categories for rounded corners
          const visibleCategories = STATUS_PRODUKSI_CATEGORIES.filter(cat => (counts[cat.id] || 0) > 0);
          const firstVisibleId = visibleCategories.length > 0 ? visibleCategories[0].id : null;
          const lastVisibleId = visibleCategories.length > 0 ? visibleCategories[visibleCategories.length - 1].id : null;

          const segments = STATUS_PRODUKSI_CATEGORIES.map(cat => {
            const count = counts[cat.id] || 0;
            const percentage = totalOrder > 0 ? (count / totalOrder) * 100 : 0;
            return {
              id: cat.id,
              label: cat.label,
              color: cat.color,
              count,
              percentage,
              isFirst: cat.id === firstVisibleId,
              isLast: cat.id === lastVisibleId,
              isSingle: visibleCategories.length === 1 && cat.id === firstVisibleId
            };
          });

          return {
            name: groupName,
            totalOrder,
            segments
          };
        });
      }, [data]);

      const maxTotalOrder = useMemo(() => {
        const max = Math.max(...groupsData.map(g => g.totalOrder), 0);
        return max > 0 ? max : 1;
      }, [groupsData]);

      const handleSegmentClick = (groupName, statusId) => {
        if (onFilterChange) {
          if (selectedGroup === groupName && selectedStatus === statusId) {
            if (onResetFilter) onResetFilter();
          } else {
            onFilterChange(groupName, statusId);
          }
        }
      };

      const handleExportCSV = () => {
        setShowMenuDropdown(false);
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += ["Group", "Total Order", ...STATUS_PRODUKSI_CATEGORIES.map(c => `"${c.label}"`)].join(",") + "\n";
        groupsData.forEach(g => {
          const row = [
            `"${g.name}"`,
            g.totalOrder,
            ...STATUS_PRODUKSI_CATEGORIES.map(c => {
              const seg = g.segments.find(s => s.id === c.id);
              return seg ? seg.count : 0;
            })
          ];
          csvContent += row.join(",") + "\n";
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `status_produksi_per_group_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleCopySummary = () => {
        setShowMenuDropdown(false);
        const summaryText = groupsData.map(g => {
          const segText = g.segments.filter(s => s.count > 0).map(s => `${s.label}: ${s.count} (${s.percentage.toFixed(1)}%)`).join(', ');
          return `[${g.name}] Total: ${g.totalOrder} | ${segText || 'Tidak ada order'}`;
        }).join('\n');
        navigator.clipboard.writeText(`Ringkasan Status Produksi per Group:\n${summaryText}`).then(() => {
          setCopiedNotification(true);
          setTimeout(() => setCopiedNotification(false), 2500);
        });
      };

      return (
        <div className="bg-white dark:bg-slate-800 rounded-2xl md:rounded-[20px] border border-slate-100 dark:border-slate-700/60 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] dark:shadow-[0_4px_20px_-4px_rgba(0,0,0,0.3)] p-5 sm:p-6 md:p-8 transition-colors flex flex-col relative">
          
          {/* Toast Notifikasi Salin */}
          {copiedNotification && (
            <div className="absolute top-5 right-5 bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-lg flex items-center gap-1.5 z-40 transition-all animate-bounce">
              <CheckCircle size={14} /> Ringkasan berhasil disalin!
            </div>
          )}

          {/* Header Card: Judul, Subtitle & Kontrol Kanan Atas */}
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div>
              <h3 className="text-lg md:text-xl font-extrabold text-slate-800 dark:text-slate-100 tracking-tight">
                {title}
              </h3>
              <p className="text-xs md:text-sm text-slate-500 dark:text-slate-400 mt-1">
                {subtitle}
              </p>
            </div>

            {/* Aksi Kanan Atas: Dropdown "Total" dan Menu Tiga Titik */}
            <div className="flex items-center gap-2 self-start sm:self-auto">
              
              {/* Dropdown "Total": Total Order / Percentage */}
              <div className="relative" ref={modeDropdownRef}>
                <button
                  type="button"

          {/* Indikator Filter Aktif (bisa di-reset dengan klik badge) */}
          {(selectedGroup || selectedStatus) && (

              {selectedGroup && (
                <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-blue-50 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 text-xs font-bold border border-blue-200/80 dark:border-blue-800/60 shadow-sm">
                  Group: {selectedGroup}
                  <button 
                    type="button"

              {selectedStatus && (
                <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-100 text-xs font-bold border border-slate-200 dark:border-slate-600 shadow-sm">
                  <span className="w-2 h-2 rounded-full" style={{ backgroundColor: STATUS_PRODUKSI_CATEGORIES.find(c => c.id === selectedStatus)?.color }} />
                  Status: {STATUS_PRODUKSI_CATEGORIES.find(c => c.id === selectedStatus)?.label}
                  <button

          {/* Area Chart: Stacked Horizontal Bars */}
          <div className="flex flex-col gap-4 relative">
            
            {groupsData.map(group => {
              const isGroupActive = !selectedGroup || selectedGroup === group.name;

              return (

                    {/* Subtle horizontal gridline */}
                    {showGridlines && (
                      <div className="absolute inset-x-0 top-1/2 -translate-y-1/2 border-b border-dashed border-slate-200/80 dark:border-slate-700/60 pointer-events-none -z-0" />
                    )}

                    {/* Stacked bar wrapper */}
                    <div className="relative w-full h-9 sm:h-10 bg-slate-100/80 dark:bg-slate-700/40 rounded-xl p-0.5 flex items-center">

                        className="h-full flex items-stretch transition-all duration-300 relative"
                        style={{ 
                          width: viewMode === 'percentage' 
                            ? '100%' 
                            : `${Math.max((group.totalOrder / maxTotalOrder) * 100, group.totalOrder > 0 ? 6 : 0)}%` 
                        }}
                      >
                        {group.segments.map(seg => {
                          if (seg.count === 0) return null;

                          const isSegmentActive = selectedStatus === seg.id && (selectedGroup === '' || selectedGroup === group.name);
                          const isAnyFilterActive = Boolean(selectedGroup || selectedStatus);
                          const isDimmed = isAnyFilterActive && !((!selectedGroup || selectedGroup === group.name) && (!selectedStatus || selectedStatus === seg.id));

                          // Rounded corner classes untuk segmen awal dan akhir
                          let roundedClass = 'rounded-none';
                          if (seg.isSingle) roundedClass = 'rounded-lg';
                          else if (seg.isFirst) roundedClass = 'rounded-l-lg';
                          else if (seg.isLast) roundedClass = 'rounded-r-lg';

                          // Angka di dalam segmen hanya muncul jika cukup lebar
                          const displayPercentage = seg.percentage;
                          const isWideEnough = viewMode === 'percentage' 
                            ? displayPercentage >= 6.5 
                            : (displayPercentage >= 7.5 && (group.totalOrder / maxTotalOrder) >= 0.22);

                          return (
                            <div
                              key={seg.id}
                              onClick={() => handleSegmentClick(group.name, seg.id)}
                              onMouseEnter={(e) => {
                                setHoveredSegment({
                                  group: group.name,
                                  statusId: seg.id,
                                  statusLabel: seg.label,
                                  color: seg.color,
                                  count: seg.count,
                                  percentage: seg.percentage,
                                  total: group.totalOrder,
                                  clientX: e.clientX,
                                  clientY: e.clientY
                                });
                              }}
                              onMouseMove={(e) => {
                                setHoveredSegment(prev => prev ? { ...prev, clientX: e.clientX, clientY: e.clientY } : null);
                              }}
                              onMouseLeave={() => setHoveredSegment(null)}
                              className={`h-full flex items-center justify-center relative cursor-pointer select-none transition-all duration-150 ${roundedClass} ${
                                isSegmentActive 
                                  ? 'ring-2 ring-blue-500 ring-offset-1 dark:ring-offset-slate-900 z-10 brightness-110 shadow-md scale-[1.02]' 
                                  : isDimmed 
                                    ? 'opacity-30 hover:opacity-75' 
                                    : 'hover:brightness-105 hover:z-10'
                              }`}
                              style={{
                                width: `${seg.percentage}%`,
                                backgroundColor: seg.color
                              }}
                              title={`${group.name} - ${seg.label}: ${seg.count} order (${seg.percentage.toFixed(1)}%)`}
                            >
                              {isWideEnough && (
                                <span className="text-[10px] sm:text-xs font-bold text-white drop-shadow-[0_1px_2px_rgba(0,0,0,0.5)] px-1 truncate pointer-events-none">
                                  {viewMode === 'percentage' ? `${Math.round(seg.percentage)}%` : seg.count}
                                </span>
                              )}
                            </div>
                          );
                        })}

                        {group.totalOrder === 0 && (
                          <div className="w-full h-full flex items-center justify-center text-[11px] text-slate-400 italic">
                            Belum ada order
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* Nilai TOTAL ORDER di ujung kanan */}
                  <div className="w-16 sm:w-20 flex-shrink-0 text-right">
                    <div className="flex flex-col items-end">
                      <span className="text-xs sm:text-sm font-extrabold text-slate-800 dark:text-slate-100 tracking-tight">
                        {viewMode === 'percentage' 
                          ? (group.totalOrder > 0 ? '100%' : '0%') 
                          : group.totalOrder.toLocaleString()}
                      </span>
                      {viewMode === 'percentage' && group.totalOrder > 0 && (
                        <span className="text-[10px] text-slate-400 dark:text-slate-500 font-semibold leading-none mt-0.5">
                          {group.totalOrder} order
                        </span>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}

            {/* Skala Sumbu X / Grid Bawah */}
            {showGridlines && (
              <div className="flex items-center gap-3 sm:gap-4 pt-1">
                <div className="w-24 sm:w-28 md:w-32 flex-shrink-0" />
                <div className="flex-1 flex justify-between text-[10px] font-semibold text-slate-400 dark:text-slate-500 px-1 border-t border-slate-200/60 dark:border-slate-700/50 pt-1.5">
                  {viewMode === 'percentage' ? (
                    <>
                      <span>0%</span>
                      <span>25%</span>
                      <span>50%</span>
                      <span>75%</span>
                      <span>100%</span>
                    </>
                  ) : (
                    <>
                      <span>0</span>
                      <span>{Math.round(maxTotalOrder * 0.25).toLocaleString()}</span>
                      <span>{Math.round(maxTotalOrder * 0.5).toLocaleString()}</span>
                      <span>{Math.round(maxTotalOrder * 0.75).toLocaleString()}</span>
                      <span>{maxTotalOrder.toLocaleString()}</span>
                    </>
                  )}
                </div>
                <div className="w-16 sm:w-20 flex-shrink-0" />
              </div>
            )}
          </div>

          {/* LEGEND: Baris Horizontal Tunggal & Scrollable di Mobile */}
          <div className="mt-6 pt-4 border-t border-slate-100 dark:border-slate-700/60">
            <div className="flex items-center gap-1.5 sm:gap-2 overflow-x-auto pb-1.5 custom-scrollbar text-xs">
              {STATUS_PRODUKSI_CATEGORIES.map(cat => {
                const isStatusActive = selectedStatus === cat.id;
                return (
                  <button
                    type="button"
                    key={cat.id}
                    onClick={() => {
                      if (onFilterChange) {
                        onFilterChange(selectedGroup, isStatusActive ? '' : cat.id);
                      }
                    }}
                    className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg transition-all flex-shrink-0 cursor-pointer ${
                      isStatusActive 
                        ? 'bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white font-bold ring-1 ring-slate-300 dark:ring-slate-600 shadow-sm' 
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700/40'
                    }`}
                    title={`Klik untuk filter status: ${cat.label}`}
                  >
                    <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: cat.color }} />
                    <span className="whitespace-nowrap font-medium text-slate-700 dark:text-slate-300">{cat.label}</span>
                  </button>

            </div>
          </div>

          {/* Floating Hover Tooltip */}
          {hoveredSegment && (
            <div 
              className="fixed z-50 pointer-events-none transition-opacity duration-100"
              style={{
                left: `${Math.min(Math.max(hoveredSegment.clientX, 110), window.innerWidth - 130)}px`,
                top: `${hoveredSegment.clientY - 12}px`,
                transform: 'translate(-50%, -100%)'
              }}
            >
              <div className="bg-slate-900/95 dark:bg-slate-800/95 text-white backdrop-blur-md px-3.5 py-2.5 rounded-xl shadow-2xl border border-slate-700/60 min-w-[180px] flex flex-col gap-1.5">
                <div className="flex items-center justify-between gap-3 border-b border-slate-700/60 pb-1.5">
                  <span className="font-bold text-xs text-slate-200 tracking-wide">{hoveredSegment.group}</span>
                  <span className="text-[10px] bg-slate-800 dark:bg-slate-700 px-2 py-0.5 rounded text-slate-300 font-mono">

                  <span className="text-xs font-semibold text-slate-100">{hoveredSegment.statusLabel}</span>

                <div className="flex items-baseline justify-between gap-4 mt-1 pt-1 border-t border-slate-800/60">

                  </span>

                    {hoveredSegment.percentage.toFixed(1)}%
                  </span>
                </div>
                <div className="text-[10px] text-slate-400 italic text-right">
                  {hoveredSegment.percentage.toFixed(1)}% dari total {hoveredSegment.group}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    });

    const AdminDashboard = React.memo(({ data, onRefresh, isLoading, isDarkMode }) => {
      const [filterMonth, setFilterMonth] = useState('');
      const [filterYear, setFilterYear] = useState('');
      const [dashboardFilterGrp, setDashboardFilterGrp] = useState('');
      const [dashboardFilterStatus, setDashboardFilterStatus] = useState('');

      const availableYears = useMemo(() => {
        const yearsSet = new Set();
        data.forEach(row => {
          if (row.tanggal) {
            const year = row.tanggal.split('-')[0];
            if (year) yearsSet.add(year);
          }
        });
        const years = Array.from(yearsSet).sort((a, b) => b - a);
        if (years.length === 0) {
          years.push(new Date().getFullYear().toString());
        }
        return years;
      }, [data]);

      const filteredDataByDate = useMemo(() => {
        return data.filter(row => {
          if (!row.tanggal) return true;
          const parts = row.tanggal.split('-');
          const year = parts[0];
          const month = parts[1];

          if (filterYear && year !== filterYear) return false;
          if (filterMonth && month !== filterMonth) return false;

          return true;
        });
      }, [data, filterMonth, filterYear]);

      const filteredData = useMemo(() => {
        return filteredDataByDate.filter(row => {
          if (dashboardFilterGrp && row.group_proses !== dashboardFilterGrp) return false;
          return true;
        });
      }, [filteredDataByDate, dashboardFilterGrp]);

      const summary = useMemo(() => {
        let totals = {
          prosesProduksi: 0,
          pendingProduksi: 0,
          prosesKemas: 0,
          pendingKemas: 0,
          selesaiKemas: 0
        };
        filteredData.forEach(row => {
          totals.prosesProduksi += Number(row.proses_produksi || 0);
          totals.pendingProduksi += Number(row.pending_produksi !== undefined ? row.pending_produksi : (row.pending_proses || 0));
          totals.prosesKemas += Number(row.proses_kemas || 0);
          totals.pendingKemas += Number(row.pending_kemas || 0);
          totals.selesaiKemas += Number(row.selesai_kemas || 0);
        });
        return totals;
      }, [filteredData]);

      const chartDataGroup = useMemo(() => {
        const groups = {};
        filteredData.forEach(row => {
          if(!groups[row.group_proses]) groups[row.group_proses] = { name: row.group_proses, Produksi: 0, Pending: 0 };
          groups[row.group_proses].Produksi += Number(row.proses_produksi || 0);
          const pendingProdVal = Number(row.pending_produksi !== undefined ? row.pending_produksi : (row.pending_proses || 0));
          groups[row.group_proses].Pending += pendingProdVal + Number(row.pending_kemas || 0);
        });
        return Object.values(groups);
      }, [filteredData]);

      const now = new Date();
      const currentYearStr = now.getFullYear().toString();
      const currentMonthStr = String(now.getMonth() + 1).padStart(2, '0');
      const currentMonthObj = MONTHS.find(m => m.value === currentMonthStr);
      const currentMonthName = currentMonthObj ? currentMonthObj.label : '';

      const chartDataTrend = useMemo(() => {
        let trendSource = filteredData;

        // Tanpa filter: Tampilkan HANYA data bulan berjalan (current month)
        if (!filterMonth && !filterYear) {
          trendSource = data.filter(row => {
            if (!row.tanggal) return false;
            const parts = row.tanggal.split('-');
            const year = parts[0];
            const month = parts[1];
            return year === currentYearStr && month === currentMonthStr;
          });

          // If no data yet in current month, fallback to filteredData
          if (trendSource.length === 0 && data.length > 0) {
            trendSource = filteredData;
          }
        }

        const dates = {};
        trendSource.forEach(row => {
          if (!dates[row.tanggal]) dates[row.tanggal] = { tanggal: row.tanggal, Produksi: 0, Selesai: 0 };
          dates[row.tanggal].Produksi += Number(row.proses_produksi || 0);
          dates[row.tanggal].Selesai += Number(row.selesai_kemas || 0);
        });
        const sorted = Object.values(dates).sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));
        return sorted;
      }, [data, filteredData, filterMonth, filterYear, currentYearStr, currentMonthStr]);

      const pieData = useMemo(() => {
        const totals = STATUS_FIELDS.map((f, i) => ({ 
          name: f.label, 
          value: 0,
          color: COLORS[i % COLORS.length]
        }));
        filteredData.forEach(row => {
          STATUS_FIELDS.forEach((f, i) => { totals[i].value += (row[f.id] || 0); });
        });
        return totals.filter(t => t.value > 0).sort((a, b) => b.value - a.value);
      }, [filteredData]);

      const resetFilters = () => {
        setFilterMonth('');
        setFilterYear('');
      };

      const selectedMonthObj = MONTHS.find(m => m.value === filterMonth);
      const selectedMonthLabel = selectedMonthObj ? selectedMonthObj.label : '';
      const filterActiveText = (filterMonth || filterYear) 
        ? `${selectedMonthLabel} ${filterYear}`.trim()
        : 'Semua Periode';

      const StatCard = ({ title, value, icon: Icon, colorClass, bgClass, darkBgClass }) => (
        <div className="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm flex items-center gap-4 hover:shadow-md transition-all">
          <div className={`p-3 rounded-full ${bgClass} ${darkBgClass} ${colorClass} shrink-0`}>
            {Icon && <Icon size={24} />}
          </div>
          <div className="overflow-hidden">
            <h4 className="text-slate-500 dark:text-slate-400 text-xs sm:text-sm font-semibold mb-0.5 truncate">{title}</h4>
            <p className="text-2xl font-bold text-slate-800 dark:text-slate-100">{value.toLocaleString()}</p>
          </div>
        </div>
      );

      // Warna Recharts berbasis JS Hex murni untuk mencegah exception di Recharts color parser
      const tooltipBg = isDarkMode ? '#1e293b' : '#ffffff';
      const tooltipBorder = isDarkMode ? '#334155' : '#e2e8f0';
      const tooltipText = isDarkMode ? '#f8fafc' : '#0f172a';
      const axisColor = isDarkMode ? '#94a3b8' : '#64748b';
      const gridColor = isDarkMode ? '#334155' : '#e2e8f0';
      const cursorColor = isDarkMode ? '#334155' : '#f8fafc';

      const tooltipStyle = useMemo(() => ({
        backgroundColor: tooltipBg,
        borderColor: tooltipBorder,
        color: tooltipText,
        borderRadius: '8px', 
        boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'
      }), [tooltipBg, tooltipBorder, tooltipText]);

      const tooltipItemStyle = useMemo(() => ({ color: tooltipText }), [tooltipText]);

      const legendFormatter = useCallback((value) => (
        <span style={{ color: isDarkMode ? '#cbd5e1' : '#334155', fontWeight: 600, fontSize: '12px' }}>
          {value}
        </span>
      ), [isDarkMode]);

      return (

          const matchSearch = search ? item.group_proses.toLowerCase().includes(search.toLowerCase()) || item.tanggal.includes(search) : true;
          
          let matchMonth = true;
          if (item.tanggal) {
            const parts = item.tanggal.split('-');
            const year = parts[0];
            const month = parts[1];
            if (filterYear && year !== filterYear) matchMonth = false;
            if (filterMonth && month !== filterMonth) matchMonth = false;
          }

          return matchGrp && matchShift && matchSearch && matchMonth;
        }).sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal)); 
      }, [data, filterGrp, filterShift, search, filterMonth, filterYear]);

      const totalPages = Math.ceil(filteredData.length / itemsPerPage);

          const [y, m, d] = dateVal.trim().split('-');
          return `${d}-${m}-${y}`;
        }
        const d = new Date(dateVal);
        if (isNaN(d.getTime())) return dateVal;
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}-${month}-${year}`;
      };

      const handleExportCSV = () => {
        const headers = ['Tanggal', 'Group Proses', 'Shift', ...STATUS_FIELDS.map(f => f.label)].join(',');
        const rows = filteredData.map(row => {

        const csvContent = "\ufeff" + [headers, ...rows].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);

    function App() {
      const [isDarkMode, setIsDarkMode] = useState(() => {
        try {
          const saved = localStorage.getItem('theme');
          if (saved !== null) return saved === 'dark';
        } catch(e) {}
        return false; // Default: Mode Light aktif saat aplikasi dibuka
      });

      const [sidebarOpen, setSidebarOpen] = useState(() => {
        return typeof window !== 'undefined' && window.innerWidth > 768;
      });

      const handleToggleSidebar = useCallback((open) => {
        setSidebarOpen(open);
        setTimeout(() => {
          window.dispatchEvent(new Event('resize'));
        }, 320);
      }, []);

      useEffect(() => {
        const root = document.documentElement;
        if (isDarkMode) {
          root.classList.add('dark');
          document.body.classList.add('dark');
        } else {
          root.classList.remove('dark');
          document.body.classList.remove('dark');
        }
        try {
          localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
        } catch(e) {}
      }, [isDarkMode]);

      const [role, setRole] = useState('ADMIN');

        } catch (err) {

                  ) : (
                    sIdx > 0 && <div className="my-2 border-t border-slate-100 dark:border-slate-800/80 mx-2" />
                  )}

                  <div className="space-y-1.5">
                    {section.items.map(item => {
                      const isActive = activeMenu === item.id;
                      const IconComponent = item.icon;

                      if (sidebarOpen) {
                        return (
                          <button
                            type="button"
                            key={item.id}
                            onClick={() => {
                              setActiveMenu(item.id);
                              if (window.innerWidth < 768) handleToggleSidebar(false);
                            }}
                            className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all duration-150 font-semibold text-sm ${
                              isActive
                                ? 'bg-blue-600 text-white shadow-sm shadow-blue-500/25'
                                : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-100/80 dark:hover:bg-slate-800/80'
                            }`}
                          >
                            {IconComponent && <IconComponent size={18} strokeWidth={isActive ? 2.2 : 1.8} className="flex-shrink-0" />}
                            <span className="truncate">{item.label}</span>
                          </button>
                        );
                      }

                      return (
                        <div key={item.id} className="relative group flex justify-center">
                          <button
                            type="button"
                            onClick={() => {
                              setActiveMenu(item.id);
                              if (window.innerWidth < 768) handleToggleSidebar(false);
                            }}
                            className={`w-11 h-11 flex items-center justify-center rounded-xl transition-all duration-150 ${
                              isActive
                                ? 'bg-blue-600 text-white shadow-sm shadow-blue-500/25'
                                : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-100/80 dark:hover:bg-slate-800/80'
                            }`}
                          >
                            {IconComponent && <IconComponent size={19} strokeWidth={isActive ? 2.2 : 1.8} />}
                          </button>
                          <div className="absolute left-full ml-3 px-2.5 py-1.5 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-semibold rounded-lg shadow-lg whitespace-nowrap opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity z-50">
                            {item.label}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </nav>

            {/* Bottom Action */}
            <div className={`border-t border-slate-200/80 dark:border-slate-800 flex-shrink-0 transition-all ${
              sidebarOpen ? 'p-3.5' : 'p-2 flex justify-center'
            }`}>
              {sidebarOpen ? (
                <button 
                  type="button" 
                  onClick={() => { handleSwitchRole(role === 'ADMIN' ? 'KARU' : 'ADMIN'); if(window.innerWidth < 768) handleToggleSidebar(false); }} 
                  className="w-full flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-all font-semibold text-xs border border-blue-200/80 dark:border-blue-800/60 shadow-sm"
                >
                  <RefreshCw size={14} strokeWidth={2} className="flex-shrink-0" /> 
                  <span className="truncate">Switch ke {role === 'ADMIN' ? 'User Baru' : 'Dashboard Admin'}</span>
                </button>
              ) : (
                <div className="relative group flex justify-center">
                  <button 
                    type="button" 
                    onClick={() => { handleSwitchRole(role === 'ADMIN' ? 'KARU' : 'ADMIN'); if(window.innerWidth < 768) handleToggleSidebar(false); }} 
                    className="w-11 h-11 flex items-center justify-center rounded-xl bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-all border border-blue-200/80 dark:border-blue-800/60 shadow-sm"
                  >
                    <RefreshCw size={16} strokeWidth={2} />
                  </button>
                  <div className="absolute left-full ml-3 px-2.5 py-1.5 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-semibold rounded-lg shadow-lg whitespace-nowrap opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity z-50">
                    Switch ke {role === 'ADMIN' ? 'User Baru' : 'Dashboard Admin'}
                  </div>
                </div>
              )}
            </div>
          </aside>

          <main className="flex-1 flex flex-col h-full overflow-hidden relative">
            <header className="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 md:px-6 flex items-center justify-between flex-shrink-0 z-10 transition-colors">
              <div className="flex items-center gap-3">
                <button 
                  type="button" 
                  className="text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white focus:outline-none p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" 
                  onClick={() => handleToggleSidebar(!sidebarOpen)}
                  title={sidebarOpen ? "Kecilkan Sidebar" : "Buka Sidebar"}
                >
                  <Menu size={22} />
                </button>
                <h1 className="text-lg sm:text-xl font-bold text-slate-800 dark:text-slate-100 truncate ml-1">
                  {activeMenuLabel}
                </h1>
              </div>

              <div className="flex items-center gap-2 sm:gap-4">
                {/* Theme Switcher Pill Toggle */}
                <div className="bg-slate-100 dark:bg-slate-700/80 p-1 rounded-xl flex items-center gap-1 border border-slate-200 dark:border-slate-600">
                  <button 
                    type="button"
                    onClick={() => setIsDarkMode(false)}
                    className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                      !isDarkMode 
                        ? 'bg-white text-amber-600 shadow-sm border border-slate-200/80' 
                        : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white'
                    }`}
                    title="Aktifkan Mode Light"
                  >
                    <Sun size={14} className={!isDarkMode ? "text-amber-500 fill-amber-500" : ""} />
                    <span>Light</span>
                  </button>

                  <button 
                    type="button"
                    onClick={() => setIsDarkMode(true)}
                    className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                      isDarkMode 
                        ? 'bg-blue-600 text-white shadow-sm' 
                        : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white'
                    }`}
                    title="Aktifkan Mode Dark"
                  >
                    <Moon size={14} className={isDarkMode ? "fill-white" : ""} />
                    <span>Dark</span>
                  </button>
                </div>

                <div className="flex items-center gap-3 border-l border-slate-200 dark:border-slate-700 pl-3 sm:pl-4 transition-colors">
                  <div className="hidden sm:flex flex-col items-end">
                    <span className="text-sm font-bold">{role === 'KARU' ? 'Kepala Regu' : 'Administrator'}</span>
                    <span className="text-xs text-green-500 font-medium flex items-center gap-1">
                      <span className="w-2 h-2 rounded-full bg-green-500"></span> Online
                    </span>
                  </div>
                  <div className="w-9 h-9 sm:w-10 sm:h-10 bg-blue-100 dark:bg-slate-700 rounded-full flex items-center justify-center border border-slate-200 dark:border-slate-600 transition-colors shrink-0">
                    <span className="font-bold text-blue-600 dark:text-slate-300 text-sm sm:text-base">{role === 'KARU' ? 'K' : 'A'}</span>
                  </div>
                </div>
              </div>
            </header>

            <div className="flex-1 overflow-auto p-4 md:p-8">
              {activeMenu === 'input' && <KaruForm onSuccess={() => { if(role === 'ADMIN') loadData(); }} />}
              
              {activeMenu === 'dashboard' && (
                isLoading && data.length === 0 ? <div className="flex h-full items-center justify-center text-slate-400 dark:text-slate-500"><Loader2 className="animate-spin mr-2" /> Memuat Data...</div> 
                          : <AdminDashboard key={`admin-dash-${isDarkMode ? 'dark' : 'light'}`} data={data} onRefresh={loadData} isLoading={isLoading} isDarkMode={isDarkMode} />
              )}

              {activeMenu === 'status-chart' && (
                isLoading && data.length === 0 ? <div className="flex h-full items-center justify-center text-slate-400 dark:text-slate-500"><Loader2 className="animate-spin mr-2" /> Memuat Data...</div> 
                          : <StatusChartMenu key={`status-menu-${isDarkMode ? 'dark' : 'light'}`} data={data} onRefresh={loadData} isLoading={isLoading} isDarkMode={isDarkMode} />
              )}

              {activeMenu === 'table' && (
                isLoading && data.length === 0 ? <div className="flex h-full items-center justify-center text-slate-400 dark:text-slate-500"><Loader2 className="animate-spin mr-2" /> Memuat Data...</div> 
                          : <DataTable data={data} onRefresh={loadData} isLoading={isLoading} />
              )}

              {activeMenu === 'pengaturan' && <PengaturanMenu isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} />}
            </div>
          </main>

          {sidebarOpen && (
            <div className="fixed inset-0 bg-slate-900/50 z-20 md:hidden" onClick={() => handleToggleSidebar(false)}></div>
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900 p-6 text-center">
              <div className="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl max-w-md w-full">
                <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100 mb-2">Terjadi Kesalahan Tampilan</h2>
                <p className="text-sm text-slate-600 dark:text-slate-400 mb-6">Komponen mengalami kendala saat memuat data. Silakan muat ulang.</p>
                <button 
                  onClick={() => { this.setState({ hasError: false }); window.location.reload(); }}
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl transition-colors"
                >
                  Muat Ulang Halaman
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
